<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <audio id="elevatorMusic" src="sound/elevatorMusic.mp3"></audio>
    <button id="musicButton">ELEVATOR MUSIC</button>

    <div class="clock-container">
        <img src="images/elevatorclock.png" alt="Elevator" class="bg" />
        <div class="arrow-hours">↑</div>
        <div class="arrow-minutes">↑</div>
        <div class="arrow-seconds">↑</div>

        <div class="hours">00</div>
        <div class="minutes">00</div>
        <div class="seconds">00</div>
    </div>
</body>

</html>
