<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<div id="closeupLayer">
    <img src="images/closeup.png" alt="closeup" id="closeUp">

    <button id="crowTalkButton">hear what the crow has to say</button>

    <div id="crowCloseSpeech" class="speechBox"></div>

    <button id="startFollowButton">follow the crow</button>
</div>

<div id="flightWorld">
    <div id="skyArea">
        <div id="flyingCrowContainer">
            <img src="images/flycrow.png" id="flyingCrow">
            <img src="images/cheese.png" id="crowMouthCheese">
        </div>
    </div>

    <div id="forestArea">
        <img src="images/mountains.png" id="flightMountains">
        <img src="images/trees.png" id="flightTrees">
        <img src="images/foreground.png" id="flightForeground">
        <img src="images/pilecheese.png" id="cheesePile">
    </div>

    <div id="crowHappySpeech" class="speechBox"></div>

    <button id="finalFollowButton">follow the crow?</button>
</div>

</body>
